<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anúncio Temu — Ofertas e Produtos Selecionados</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f9f9f9; }
        header { background: linear-gradient(135deg, #ff4d4d, #ff6600); color: white; padding: 30px; text-align: center; border-radius: 12px; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 28px; }
        .oferta { background: white; padding: 20px; margin: 15px 0; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .preco { color: #e63946; font-size: 22px; font-weight: bold; }
        .botao { display: inline-block; background: #25d366; color: white; padding: 12px 25px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 10px; }
        .botao:hover { background: #1da851; }
    </style>
</head>
<body>
    <header>
        <h1>🛍️ Anúncio Temu</h1>
        <p>As melhores ofertas e produtos selecionados pra você!</p>
    </header>

    <div class="oferta">
        <h3>🔥 Produto em Destaque</h3>
        <p>Produtos variados com até 90% de desconto + frete grátis!</p>
        <p class="preco">A partir de R$ 5,00</p>
        <a href="COLOQUE_SEU_LINK_AQUI" class="botao" target="_blank">👉 Ver Oferta na Temu</a>
    </div>

    <footer style="text-align:center; margin-top:40px; color:#666; font-size:14px;">
        <p>Site de ofertas com links de afiliados. Preços sujeitos a alteração.</p>
    </footer>
</body>
</html>
